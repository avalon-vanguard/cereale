# cereale sous /cereale/, derrière la passerelle projects.avalonvanguard.com : elle transmet le
# chemin tel quel, pose les en-têtes de sécurité et la compression, et redirige /cereale vers
# /cereale/. Ce serveur ne règle que le cache.

server {
    listen 80;
    root /usr/share/nginx/html;
    # Redirections relatives : derrière la passerelle, une redirection absolue pointerait vers
    # http://<conteneur>:80
    absolute_redirect off;
    server_tokens off;

    # Page statique et bac à sable
    location /cereale/ {
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ =404;
    }
}
