# cereale under /cereale/, behind the projects.avalonvanguard.com gateway: it passes the path
# through as is, sets the security headers and compression, and redirects /cereale to
# /cereale/. This server only handles caching.

server {
    listen 80;
    root /usr/share/nginx/html;
    # Relative redirects: behind the gateway, an absolute redirect would point to
    # http://<container>:80
    absolute_redirect off;
    server_tokens off;

    # Static page and sandbox
    location /cereale/ {
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ =404;
    }
}
