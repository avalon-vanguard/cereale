# Builds the cereale image, pushes it to the Gitea registry and deploys it to Openship:
# an internal service, no domain, which the projects.avalonvanguard.com gateway serves under /cereale/.
# "cereale" service of the Openship "projects" project, next to the gateway: image.yml deploys only
# this service. Secret: the organization's OPENSHIP_API_TOKEN, which covers "projects"; no
# repository secret of the same name, it would shadow this one.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: avalon-vanguard/ci/.gitea/workflows/image.yml@v2
    with:
      openship-project: proj_a0A_iEcpcD2hSrn2
      openship-service: svc_Igg8bxQBVAx-ReBZ
    secrets: inherit
