# CI checks on Gitea, through the shared avalon-vanguard/ci workflow.
# GitHub (read-only mirror) now only runs Pages and the npm publish. The post-build checks (entry points, demo, published types,
# docs page) are grouped in the "check" script.
#
# The job runs "npm run test:coverage" and fails below 80 % total line coverage, read from
# coverage/coverage-summary.json (default floor of node.yml@v2).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x, 26.x]
    uses: avalon-vanguard/ci/.gitea/workflows/node.yml@v2
    with:
      node-version: ${{ matrix.node }}
      coverage: true
    secrets: inherit
