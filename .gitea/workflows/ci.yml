# Contrôles de CI sur Gitea, par le workflow commun avalon-vanguard/ci.
# GitHub (miroir en lecture seule) n'exécute plus que Pages et la publication npm. Les contrôles post-build (points d'entrée, démo, types publiés,
# page de docs) sont regroupés dans le script « check ».
#
# The job runs "npm run test:coverage" and fails below 80 % total line coverage, read from
# coverage/coverage-summary.json (default floor of node.yml@v2).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    uses: avalon-vanguard/ci/.gitea/workflows/node.yml@v2
    with:
      node-version: ${{ matrix.node }}
      coverage: true
    secrets: inherit
