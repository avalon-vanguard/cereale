# Quality checks on every push and every PR through the shared avalon-vanguard/ci workflow:
# secrets (gitleaks), vulnerable dependencies (osv-scanner), duplication (jscpd) and code flaws
# (semgrep). Gitleaks and semgrep only look at the diff, never at existing code.
name: quality

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    uses: avalon-vanguard/ci/.gitea/workflows/quality.yml@v2
    with:
      jscpd-path: src
