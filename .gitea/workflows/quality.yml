# Contrôles qualité de chaque push et de chaque PR par le workflow commun avalon-vanguard/ci :
# secrets (gitleaks), dépendances vulnérables (osv-scanner), duplication (jscpd) et failles du code
# (semgrep). Gitleaks et semgrep ne regardent que le diff, jamais l'existant.
name: Qualité

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    uses: avalon-vanguard/ci/.gitea/workflows/quality.yml@v1
    with:
      jscpd-path: src
      # Dépendances de développement vulnérables, toutes corrigibles (vitest et @vitest/mocker 4.1.11,
      # brace-expansion 5.0.12, nanoid 3.3.18, source-map-js 1.2.2) : à mettre à jour via Renovate,
      # puis retirer cette ligne pour que le contrôle redevienne bloquant.
      osv-blocking: false
