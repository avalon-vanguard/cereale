# Managed file, synced from avalon-vanguard/ci. Change it there, not here.
name: Junie review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    uses: avalon-vanguard/ci/.gitea/workflows/junie-review.yml@v2
    secrets:
      JUNIE_DOPBASE_TOKEN: ${{ secrets.JUNIE_DOPBASE_TOKEN }}
      CLAUDE_DOPBASE_TOKEN: ${{ secrets.CLAUDE_DOPBASE_TOKEN }}
      CLAUDE_GITEA_TOKEN: ${{ secrets.CLAUDE_GITEA_TOKEN }}
